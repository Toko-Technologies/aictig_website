# Production deploy for aictig.org.
#
# Any push to the `production` branch deploys to the VPS. You can also run it
# by hand from the Actions tab ("Run workflow"), so a deploy never needs a
# particular laptop. Day-to-day work stays on `main`; release with:
#
#     git push origin main:production
#
# How it is safe:
#   - `verify` runs the unit tests, typechecks and builds on GitHub first. A
#     commit that fails any of them never reaches the server.
#   - The SSH key in DEPLOY_SSH_KEY is pinned on the server to a FORCED
#     COMMAND (/usr/local/sbin/aictig-deploy.sh) with `restrict`. Even if this
#     secret leaked, it cannot open a shell, forward a port or read a file -
#     only trigger this one deploy.
#   - The host key is pinned via DEPLOY_KNOWN_HOSTS, so the job will not talk
#     to an impostor.
#   - The server builds into a separate directory and swaps it in only when
#     complete, then health-checks. Telegram is told either way.
name: Deploy to production

on:
  push:
    branches: [production]
  workflow_dispatch:

# One deploy at a time. Queue rather than cancel: cancelling mid-deploy could
# leave the box with dependencies installed for a commit it is not serving.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20          # matches the server (node v20)
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npx vitest run

      - name: Typecheck and build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Repository secret $v is not set."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "Triggering deploy on $DEPLOY_HOST (forced command on the server)..."
          # No command is sent on purpose: the server's authorized_keys decides
          # what runs. -T because the key forbids a PTY.
          ssh -T -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              "${DEPLOY_USER}@${DEPLOY_HOST}"

      - name: Confirm the site is up from the public internet
        run: |
          set -u
          for url in https://aictig.org/ https://www.aictig.org/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            echo "$url -> $code"
            test "$code" = "200"
          done
